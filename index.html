<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Executive Itinerary Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #121929;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #8e9cb0;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 16px; }
    .top-bar h1 { font-size: 1.5rem; font-weight: 700; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

    .status-badge { background: #059669; color: white; padding: 6px 12px; border-radius: 6px; font-weight: 600; font-size: 0.85rem; }
    .select-box { background: #1e293b; border: 1px solid var(--border-color); color: white; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; outline: none; min-width: 200px; }

    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .kpi-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
    .kpi-card .label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .kpi-card .value { font-size: 2.2rem; font-weight: 800; }
    .kpi-card .subtext { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }

    .val-blue { color: #38bdf8; }
    .val-green { color: #10b981; }
    .val-gold { color: #f59e0b; }

    .dashboard-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 1024px) { .dashboard-layout { grid-template-columns: 1fr; } }

    .chart-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; }
    .chart-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .chart-title { font-size: 1.1rem; font-weight: 700; }

    .canvas-container { position: relative; height: 300px; width: 100%; }

    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    .leaderboard-table th { text-align: left; padding: 12px; color: var(--text-muted); font-size: 0.75rem; border-bottom: 1px solid var(--border-color); }
    .leaderboard-table td { padding: 12px; border-bottom: 1px solid #1a2333; font-weight: 600; }
  </style>
</head>
<body>

  <div id="dashboardContent">
    <div class="top-bar">
      <h1>Sales Executive Itinerary Dashboard</h1>
      <div class="controls">
        <div class="status-badge" id="syncStatus">CONNECTING...</div>
        <select id="asmFilter" class="select-box" onchange="onAsmChange()"><option value="ALL">All Area Managers (ASM)</option></select>
        <select id="seFilter" class="select-box" onchange="renderUI()"><option value="ALL">All Sales Executives (Overview)</option></select>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi-card">
        <div class="label">Active Customers</div>
        <div class="value" id="kpiActive">0</div>
        <div class="subtext">Total Portfolio</div>
      </div>
      <div class="kpi-card">
        <div class="label">Visited Customers</div>
        <div class="value val-green" id="kpiVisited">0</div>
        <div class="subtext" id="kpiRemaining">0 Remaining</div>
      </div>
      <div class="kpi-card">
        <div class="label">Current Hit Rate</div>
        <div class="value val-blue" id="kpiHitRate">0.0%</div>
        <div class="subtext">Target Pace</div>
      </div>
      <div class="kpi-card">
        <div class="label">Leader</div>
        <div class="value val-gold" id="kpiRank">#--</div>
        <div class="subtext" id="kpiRankSub">Overview Mode</div>
      </div>
    </div>

    <div class="dashboard-layout">
      <div class="chart-card">
        <div class="chart-header"><div class="chart-title">Hit Rate Trend (%)</div></div>
        <div class="canvas-container"><canvas id="trendChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-header"><div class="chart-title">Hit Rate by SE (%)</div></div>
        <div class="canvas-container"><canvas id="rankChart"></canvas></div>
      </div>
    </div>

    <div class="dashboard-layout">
      <div class="chart-card">
        <div class="chart-header"><div class="chart-title">Visited vs Remaining</div></div>
        <div class="canvas-container"><canvas id="volumeChart"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-header"><div class="chart-title">Leaderboard</div></div>
        <div style="overflow-x: auto;">
          <table class="leaderboard-table">
            <thead><tr><th>SE</th><th>ASM</th><th>ACTIVE</th><th>VISITED</th><th>RATE</th></tr></thead>
            <tbody id="leaderboardBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzQx7G10Kpb1v4LDO_iZxEGxCVQrRen6wWvRNnn9tzAT6AXmGHDddiMg4vqWh8D_Sk/exec';

    const asmMapping = {
      'HMD': 'Mr.Farzaan', 
      'RSD': 'Mr.Farzaan', 
      'FZN': 'Mr.Farzaan',
      'RKZ': 'Mr.Hilmy',   
      'RFD': 'Mr.Hilmy',   
      'MZR': 'Mr.Hilmy',
      'AMT': 'Mr.Sabir',   
      'DNT': 'Mr.Sabir'
    };

    let globalRawData = [];
    let dateColumns = [];
    let trendChartInstance = null, rankChartInstance = null, volumeChartInstance = null;

    document.addEventListener("DOMContentLoaded", function() {
      loadData();
    });

    // Helper to safely extract numerical values from strings or numbers
    function cleanNumber(val) {
      if (val === null || val === undefined) return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      if (typeof val === 'string') {
        let cleaned = val.replace(/[^0-9.-]/g, '');
        let parsed = parseFloat(cleaned);
        return isNaN(parsed) ? 0 : parsed;
      }
      return 0;
    }

    async function loadData() {
      const statusBadge = document.getElementById('syncStatus');
      try {
        const res = await fetch(APPS_SCRIPT_URL, { redirect: "follow" });
        const json = await res.json();
        let rows = Array.isArray(json) ? json : (json.data || json.rows || json.result || []);
        if (rows.length > 0) {
          statusBadge.innerText = 'LIVE API CONNECTED';
          processDataPayload(rows);
          return;
        }
        throw new Error("Empty Payload");
      } catch (err) {
        statusBadge.innerText = 'OFFLINE MOCK DATA';
        statusBadge.style.background = '#f59e0b';
        loadMockData();
      }
    }

    function loadMockData() {
      dateColumns = ['26-Aug', '27-Aug', '28-Aug', '29-Aug', '30-Aug'];
      globalRawData = [
        { se: 'HMD', asm: 'Mr.Farzaan', active: 67, visited: 50, hitRate: 74.6, dailyTrend: {'26-Aug': 10, '27-Aug': 20, '28-Aug': 30, '29-Aug': 40, '30-Aug': 50} },
        { se: 'RSD', asm: 'Mr.Farzaan', active: 56, visited: 44, hitRate: 78.6, dailyTrend: {'26-Aug': 8, '27-Aug': 18, '28-Aug': 28, '29-Aug': 36, '30-Aug': 44} },
        { se: 'FZN', asm: 'Mr.Farzaan', active: 68, visited: 55, hitRate: 80.9, dailyTrend: {'26-Aug': 12, '27-Aug': 22, '28-Aug': 35, '29-Aug': 45, '30-Aug': 55} },
        { se: 'RKZ', asm: 'Mr.Hilmy', active: 89, visited: 70, hitRate: 78.7, dailyTrend: {'26-Aug': 15, '27-Aug': 30, '28-Aug': 45, '29-Aug': 60, '30-Aug': 70} },
        { se: 'RFD', asm: 'Mr.Hilmy', active: 101, visited: 90, hitRate: 89.1, dailyTrend: {'26-Aug': 20, '27-Aug': 40, '28-Aug': 60, '29-Aug': 80, '30-Aug': 90} },
        { se: 'MZR', asm: 'Mr.Hilmy', active: 53, visited: 50, hitRate: 94.3, dailyTrend: {'26-Aug': 10, '27-Aug': 20, '28-Aug': 30, '29-Aug': 40, '30-Aug': 50} },
        { se: 'AMT', asm: 'Mr.Sabir', active: 65, visited: 60, hitRate: 92.3, dailyTrend: {'26-Aug': 12, '27-Aug': 24, '28-Aug': 36, '29-Aug': 48, '30-Aug': 60} },
        { se: 'DNT', asm: 'Mr.Sabir', active: 46, visited: 40, hitRate: 87.0, dailyTrend: {'26-Aug': 8, '27-Aug': 16, '28-Aug': 24, '29-Aug': 32, '30-Aug': 40} }
      ];
      populateAsmDropdown();
      populateSeDropdown();
      renderUI();
    }

    function processDataPayload(rows) {
      globalRawData = [];
      if (!rows || rows.length === 0) return loadMockData();

      if (Array.isArray(rows[0])) {
        const headers = rows[0].map(h => String(h || '').trim());
        dateColumns = headers.slice(3).filter(col => col !== '');

        for (let i = 1; i < rows.length; i++) {
          const r = rows[i];
          if (!r || r[0] === undefined || r[0] === null) continue;
          
          let se = String(r[0]).trim().toUpperCase();
          if (!asmMapping[se]) continue;

          const active = cleanNumber(r[1]);
          const visited = cleanNumber(r[2]);
          const asm = asmMapping[se];
          
          let dailyTrend = {};
          dateColumns.forEach((d, idx) => {
            dailyTrend[d] = cleanNumber(r[3 + idx]);
          });

          globalRawData.push({
            se, asm, active, visited,
            hitRate: active > 0 ? (visited / active) * 100 : 0,
            dailyTrend
          });
        }
      }

      if (globalRawData.length === 0) loadMockData();
      else {
        populateAsmDropdown();
        populateSeDropdown();
        renderUI();
      }
    }

    function populateAsmDropdown() {
      const asmFilter = document.getElementById('asmFilter');
      const asms = Array.from(new Set(Object.values(asmMapping)));
      asmFilter.innerHTML = '<option value="ALL">All Area Managers (ASM)</option>';
      asms.forEach(asm => { 
        asmFilter.innerHTML += `<option value="${asm}">${asm}</option>`; 
      });
    }

    function populateSeDropdown() {
      const asmFilter = document.getElementById('asmFilter');
      const seFilter = document.getElementById('seFilter');
      const selectedASM = asmFilter.value;
      
      seFilter.innerHTML = '<option value="ALL">All Sales Executives (Overview)</option>';
      
      globalRawData.forEach(d => {
        if (selectedASM === 'ALL' || d.asm === selectedASM) {
          seFilter.innerHTML += `<option value="${d.se}">${d.se} (${d.hitRate.toFixed(1)}%)</option>`;
        }
      });
    }

    function onAsmChange() {
      populateSeDropdown();
      renderUI();
    }

    function renderUI() {
      const selectedASM = document.getElementById('asmFilter').value;
      const selectedSE = document.getElementById('seFilter').value;

      let filtered = globalRawData;
      if (selectedASM !== 'ALL') filtered = filtered.filter(d => d.asm === selectedASM);
      if (selectedSE !== 'ALL') filtered = filtered.filter(d => d.se === selectedSE);

      const sorted = filtered.slice().sort((a, b) => b.hitRate - a.hitRate);
      
      let totalActive = 0, totalVisited = 0;
      filtered.forEach(d => { totalActive += d.active; totalVisited += d.visited; });

      document.getElementById('kpiActive').innerText = totalActive;
      document.getElementById('kpiVisited').innerText = totalVisited;
      document.getElementById('kpiRemaining').innerText = Math.max(0, totalActive - totalVisited) + " Remaining";
      document.getElementById('kpiHitRate').innerText = (totalActive > 0 ? ((totalVisited / totalActive) * 100).toFixed(1) : 0) + "%";
      
      if (selectedSE !== 'ALL' && sorted.length) {
        document.getElementById('kpiRank').innerText = selectedSE;
        document.getElementById('kpiRankSub').innerText = 'ASM: ' + (asmMapping[selectedSE] || 'N/A');
      } else if (sorted.length) {
        document.getElementById('kpiRank').innerText = "#1 " + sorted[0].se;
        document.getElementById('kpiRankSub').innerText = selectedASM !== 'ALL' ? 'Top SE in ' + selectedASM : 'Top Performing Sales Exec';
      } else {
        document.getElementById('kpiRank').innerText = "#--";
        document.getElementById('kpiRankSub').innerText = 'Overview Mode';
      }

      const tbody = document.getElementById('leaderboardBody');
      tbody.innerHTML = '';
      sorted.forEach(d => {
        tbody.innerHTML += `<tr>
          <td style="color:#fff;">${d.se}</td>
          <td style="color:#8e9cb0;">${d.asm}</td>
          <td>${d.active}</td>
          <td style="color:#10b981;">${d.visited}</td>
          <td style="color:#38bdf8;">${d.hitRate.toFixed(1)}%</td>
        </tr>`;
      });

      if (window.Chart) {
        const trendData = dateColumns.map(day => {
          let dayVisitedSum = 0;
          let dayActiveSum = 0;

          filtered.forEach(d => { 
            let dayVal = cleanNumber(d.dailyTrend[day]);
            // Fallback to total visited if daily trend points are missing
            if (dayVal === 0 && d.visited > 0) dayVal = d.visited;
            
            dayVisitedSum += dayVal; 
            dayActiveSum += cleanNumber(d.active); 
          });

          return dayActiveSum > 0 ? Number(((dayVisitedSum / dayActiveSum) * 100).toFixed(1)) : 0;
        });

        if (trendChartInstance) trendChartInstance.destroy();
        trendChartInstance = new Chart(document.getElementById('trendChart'), {
          type: 'line',
          data: {
            labels: dateColumns.length > 0 ? dateColumns : ['Current Pace'],
            datasets: [{ 
              label: 'Hit Rate %', 
              data: trendData.length > 0 ? trendData : [totalActive > 0 ? Number(((totalVisited / totalActive) * 100).toFixed(1)) : 0], 
              borderColor: '#38bdf8', 
              backgroundColor: 'rgba(56, 189, 248, 0.15)', 
              fill: true, 
              tension: 0.35 
            }]
          },
          options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { min: 0, max: 100 } } }
        });

        if (rankChartInstance) rankChartInstance.destroy();
        rankChartInstance = new Chart(document.getElementById('rankChart'), {
          type: 'bar',
          data: { labels: sorted.map(d => d.se), datasets: [{ data: sorted.map(d => d.hitRate.toFixed(1)), backgroundColor: '#38bdf8' }] },
          options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        if (volumeChartInstance) volumeChartInstance.destroy();
        volumeChartInstance = new Chart(document.getElementById('volumeChart'), {
          type: 'bar',
          data: {
            labels: sorted.map(d => d.se),
            datasets: [
              { label: 'Visited', data: sorted.map(d => d.visited), backgroundColor: '#10b981' },
              { label: 'Remaining', data: sorted.map(d => Math.max(0, d.active - d.visited)), backgroundColor: '#1e293b' }
            ]
          },
          options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
        });
      }
    }
  </script>
</body>
</html>
