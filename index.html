<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Executive Itinerary Dashboard</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #121929;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #8e9cb0;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      min-height: 100vh;
    }

    .login-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-card h2 { font-size: 1.4rem; margin-bottom: 6px; text-align: center; }
    .login-card p { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px; text-align: center; }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent-blue);
      border: none;
      border-radius: 6px;
      color: #090d16;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .error-msg { color: #ef4444; font-size: 0.8rem; margin-top: 10px; text-align: center; display: none; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .top-bar h1 { font-size: 1.5rem; font-weight: 700; }
    .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .status-badge {
      background: #059669;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
    }
    .select-box {
      background: #1e293b;
      border: 1px solid var(--border-color);
      color: white;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      min-width: 200px;
    }
    .select-box optgroup {
      background: #1e293b;
      color: var(--accent-blue);
      font-weight: bold;
    }
    .select-box option {
      background: #090d16;
      color: white;
    }
    .logout-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }
    .kpi-card .label { font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
    .kpi-card .value { font-size: 2.2rem; font-weight: 800; }
    .kpi-card .subtext { font-size: 0.8rem; color: var(--text-muted); margin-top: 8px; }
    .val-blue { color: #38bdf8; }
    .val-green { color: #10b981; }
    .val-gold { color: #f59e0b; }

    .dashboard-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    @media (max-width: 1024px) { .dashboard-layout { grid-template-columns: 1fr; } }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
    }
    .chart-header { display: flex; justify-content: space-between; margin-bottom: 16px; }
    .chart-title { font-size: 1.1rem; font-weight: 700; }
    .canvas-container { position: relative; height: 300px; width: 100%; }

    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
    .leaderboard-table th { text-align: left; padding: 12px; color: var(--text-muted); font-size: 0.75rem; border-bottom: 1px solid var(--border-color); }
    .leaderboard-table td { padding: 12px; border-bottom: 1px solid #1a2333; font-weight: 600; }
  </style>
</head>
<body>

  <div class="login-wrapper" id="loginScreen">
    <div class="login-card">
      <h2>Admin Login</h2>
      <p>Enter credentials to view dashboard</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" class="form-control" value="admin" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" class="form-control" value="password123" required>
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="error-msg" id="errorMsg">Invalid login details.</div>
      </form>
    </div>
  </div>

  <div id="dashboardContent" style="display: none;">
    <div class="top-bar">
      <h1>Sales Executive Itinerary Dashboard</h1>
