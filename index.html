<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Executive Itinerary Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge { padding: 6px 12px; border-radius: 20px; font-weight: bold; font-size: 14px; background: #f59e0b; color: #fff; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; }
    .card h3 { margin: 0 0 10px 0; font-size: 14px; color: #94a3b8; }
    .card .val { font-size: 28px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="header">
    <h2>Sales Executive Itinerary Dashboard</h2>
    <span id="syncStatus" class="badge">CONNECTING...</span>
  </div>

  <div class="card-grid">
    <div class="card">
      <h3>ACTIVE CUSTOMERS</h3>
      <div id="activeVal" class="val">--</div>
    </div>
    <div class="card">
      <h3>VISITED CUSTOMERS</h3>
      <div id="visitedVal" class="val">--</div>
    </div>
    <div class="card">
      <h3>CURRENT HIT RATE</h3>
      <div id="hitRateVal" class="val">--</div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxm3e1uGi0JpvguTcW5eg7212biYd95mCwUqot2y7aViDDv0OuAR7_1oEwmuNikMjc/exec';

    async function loadData() {
      const statusBadge = document.getElementById('syncStatus');
      try {
        const res = await fetch(APPS_SCRIPT_URL, { 
          method: "GET",
          redirect: "follow" 
        });

        if (!res.ok) throw new Error(`HTTP Status: ${res.status}`);

        const json = await res.json();

        if (json.monthlyData && Object.keys(json.monthlyData).length > 0) {
          statusBadge.innerText = 'LIVE API CONNECTED';
          statusBadge.style.background = '#059669';
          processData(json.monthlyData);
          return;
        }

        throw new Error("Empty or malformed payload");
      } catch (err) {
        console.error("Fetch failure:", err);
        statusBadge.innerText = 'OFFLINE MOCK DATA';
        statusBadge.style.background = '#f59e0b';
        loadMockData();
      }
    }

    function processData(monthlyData) {
      let totalActive = 0;
      let totalVisited = 0;

      const firstPeriod = Object.keys(monthlyData)[0];
      const rows = monthlyData[firstPeriod] || [];

      rows.forEach(item => {
        totalActive += item.active;
        totalVisited += item.visited;
      });

      const overallHitRate = totalActive > 0 ? ((totalVisited / totalActive) * 100).toFixed(1) : 0;

      document.getElementById('activeVal').innerText = totalActive;
      document.getElementById('visitedVal').innerText = totalVisited;
      document.getElementById('hitRateVal').innerText = overallHitRate + '%';
    }

    function loadMockData() {
      document.getElementById('activeVal').innerText = '545';
      document.getElementById('visitedVal').innerText = '459';
      document.getElementById('hitRateVal').innerText = '84.2%';
    }

    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
