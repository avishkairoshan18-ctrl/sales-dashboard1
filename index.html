<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Executive Itinerary Dashboard</title>

  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: #121929;
      --border-color: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #8e9cb0;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-gold: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    /* Screen State Controls */
    #dashboardContent {
      display: none;
    }

    /* Login Screen Styling */
    .login-wrapper {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      font-size: 1.4rem;
      margin-bottom: 6px;
      color: #fff;
      text-align: center;
    }

    .login-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 10px 14px;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: white;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-blue);
    }
